name: Package automation tests
on:
  push:
    branches: [main]
    paths: ['.github/**', 'docs/releasing.md']
  pull_request:
    paths: ['.github/**', 'docs/releasing.md']
permissions:
  contents: read
  actions: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: false
      - name: Lint workflow syntax and expression contexts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only verification of the existing immutable rc.4 release
        uses: shoon/fv-ssh-unlock/.github/actions/release-tools@05a045b9bab8cf91376b680c4aa926ffb8fb06cf # reviewed release automation
        with:
          operation: verify
          tag: v0.2.0-rc.4
          expected-sha: 9428a2c332b887c23cdd9038a3f2e7a8ffc81a65
