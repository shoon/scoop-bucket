name: Update manifests
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-manifest-sync
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'shoon/scoop-bucket' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage newer stable Audio Fade Fixer and Takeout Helper manifests
        shell: pwsh
        run: ./.github/scripts/stage-stable.ps1
      - name: Validate before any repository write
        shell: pwsh
        run: ./.github/scripts/validate.ps1
      - name: Open tested manifest PRs instead of pushing main
        uses: shoon/fv-ssh-unlock/.github/actions/release-tools@05a045b9bab8cf91376b680c4aa926ffb8fb06cf # reviewed release automation
        with:
          operation: stage-pr
          dry-run: 'false'
